<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Brightside newsletter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><strong>Brightside Home</strong> &nbsp; <a href="index.html">Home</a></header>
<main>
  <h1>Join the Brightside newsletter</h1>
  <!-- Planted: pre-ticked marketing box and no privacy link on this page -->
  <form action="#" method="post">
    <label>First name <input type="text" name="first_name"></label><br><br>
    <label>Email <input type="email" name="email" placeholder="you@example.com"></label><br><br>
    <label><input type="checkbox" name="offers" checked> Send me offers and news from Brightside</label><br>
    <label><input type="checkbox" name="partners" checked> Yes, I'd also like offers from selected partners</label><br><br>
    <button type="submit">Join</button>
  </form>
</main>
<footer><p>&copy; 2026 Brightside Home</p></footer>
</body>
</html>
